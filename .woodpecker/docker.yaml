when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: docker-operator
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: git.example.com
      repo: registry.example.com/example/cephrgw-operator
      dockerfile: Dockerfile.operator
      username: droneci
      password:
        from_secret: DRONECI_PASSWORD
      tags:
        - ${CI_COMMIT_TAG}
        - latest
