when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: docker-operator
    image: registry.example.com/internal/plugin-docker-buildx:latest
    settings:
      registry: registry.example.com
      repo: registry.example.com/internal/cephrgw-operator
      dockerfile: Dockerfile.operator
      buildkit_config: |
        [registry."registry.example.com"]
          ca = ["/etc/docker/certs.d/registry.example.com/ca.crt"]
      tags:
        - ${CI_COMMIT_TAG}
        - latest
