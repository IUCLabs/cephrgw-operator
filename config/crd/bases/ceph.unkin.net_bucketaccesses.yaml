    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BucketAccess grants an RGW user read-only, read-write or full access to a
          Bucket via the bucket's S3 policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
